<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="icon.png">
  <title>Cleanily • Laboratorium OQC WM</title>
  <style>
    :root{--bg:#0a0f1c;--surface:#111827;--surface2:#182235;--line:#2a3850;--text:#f8fafc;--muted:#9eabc0;--blue:#38bdf8;--ok:#22c55e;--nok:#ef4444;--na:#64748b;--warn:#f59e0b;--r:18px;--shadow:0 14px 40px #0007}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{margin:0;min-width:280px;background:radial-gradient(circle at 100% 0,#12304a 0,transparent 34rem),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
    button,input,textarea{font:inherit}
    button{color:inherit}
    .app{width:min(100%,780px);margin:auto;padding:env(safe-area-inset-top) 14px calc(112px + env(safe-area-inset-bottom))}
    .top{padding:24px 4px 17px}
    .brand{display:flex;align-items:center;gap:12px}
    .brandmark{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;overflow:hidden;box-shadow:0 7px 18px #0284c744}
    .brandmark img{display:block;width:100%;height:100%;object-fit:cover}
    h1{margin:0;font-size:clamp(21px,6vw,31px);line-height:1.08;letter-spacing:-.03em}
    .subtitle{margin:6px 0 0;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.12em}
    .meta,.progress-card,.card,.summary{border:1px solid var(--line);background:linear-gradient(145deg,#152035e8,#0f172ae8);box-shadow:var(--shadow)}
    .meta{border-radius:var(--r);padding:15px;margin-bottom:12px;display:block}
    label.field{display:grid;gap:7px;color:#d8e0ec;font-size:13px;font-weight:750}
    input[type=text],textarea{width:100%;border:1px solid #35445e;border-radius:12px;background:#09111f;color:var(--text);outline:0;padding:13px 14px;min-height:50px}
    input[type=text]:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #38bdf822}
    textarea{resize:vertical;min-height:88px}
    .start{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}
    .start strong{color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
    .progress-card{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:20;border-radius:15px;padding:11px 13px;margin-bottom:12px}
    .progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:800}
    .progress-head span:last-child{color:var(--blue)}
    .track{height:8px;border-radius:20px;background:#07101d;overflow:hidden}
    .bar{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#0ea5e9,#22c55e);transition:width .35s ease}
    .cards{display:grid;gap:11px}
    .card{border-radius:var(--r);overflow:hidden;transition:border-color .2s}
    .card.done{border-color:#22c55e70}
    .card.error{border-color:var(--nok);animation:shake .24s linear 2}
    @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
    .card-head{width:100%;min-height:74px;border:0;background:transparent;display:grid;grid-template-columns:42px 1fr 26px;gap:11px;align-items:center;text-align:left;padding:12px 14px;cursor:pointer}
    .num{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#23314a;color:#bcecff;font-weight:900}
    .card.done .num{background:#123d29;color:#75f0a2}
    .title{font-weight:850;letter-spacing:-.01em}
    .state{display:block;margin-top:3px;color:var(--muted);font-size:12px;font-weight:650}
    .chev{font-size:20px;color:var(--muted);transition:transform .25s}
    .card.open .chev{transform:rotate(180deg)}
    .panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
    .card.open .panel{grid-template-rows:1fr}
    .panel-inner{overflow:hidden}
    .content{padding:0 14px 16px;border-top:1px solid var(--line)}
    .criteria{margin:14px 0;color:#bac5d5;font-size:13px}
    .photo-block{margin-top:14px}
    .photo-input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
    .photo-btn,.ghost,.primary,.danger,.export{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:12px;border:1px solid #36516d;font-weight:850;cursor:pointer}
    .photo-btn{background:#132a3f;color:#b9eaff;width:100%}
    .photo-btn:active,.primary:active,.ghost:active,.danger:active,.export:active{transform:translateY(1px)}
    .preview{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;background:#080d16;border:1px solid var(--line)}
    .preview img{display:block;width:100%;max-height:260px;object-fit:cover}
    .panorama .preview img{max-height:440px;aspect-ratio:4/3;object-fit:contain}
    .remove{position:absolute;right:8px;top:8px;min-width:46px;min-height:46px;border:1px solid #ffffff55;border-radius:50%;background:#080d16dd;color:white;font-size:20px;cursor:pointer}
    .photo-meta{padding:8px 10px;color:var(--muted);font-size:11px}
    .hint{display:flex;gap:9px;padding:11px;border-radius:12px;background:#f59e0b13;border:1px solid #f59e0b44;color:#ffd991;font-size:12px;margin:14px 0}
    .summary{margin-top:14px;border-radius:var(--r);padding:15px}
    .summary h2{margin:0 0 7px;font-size:18px}
    .summary p{margin:0 0 14px;color:var(--muted);font-size:13px}
    .actions{display:grid;gap:9px}
    .primary{border-color:#0284c7;background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff}
    .export{background:#12243a;color:#c6eaff}
    .danger{background:#2b131a;border-color:#7f2633;color:#ffadb7}
    .save-indicator{min-height:18px;margin:10px 2px 0;text-align:center;color:var(--muted);font-size:11px}
    .toast{position:fixed;z-index:100;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,120px);width:min(calc(100% - 28px),520px);padding:13px 15px;border:1px solid #43536c;border-radius:13px;background:#182235;color:#fff;box-shadow:var(--shadow);font-weight:750;opacity:0;transition:.25s}
    .toast.show{transform:translate(-50%,0);opacity:1}
    .toast.bad{border-color:#ef4444aa;background:#3a181f}
    #printReport{display:none}
    @media(min-width:600px){.actions{grid-template-columns:1fr 1fr}.actions .danger{grid-column:1/-1}.content{padding-left:67px;padding-right:18px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
    @media print{
      @page{size:A4;margin:12mm}
      body{background:#fff!important;color:#111!important;font:11pt/1.35 Arial,sans-serif}
      .app,.toast{display:none!important}
      #printReport{display:block!important}
      .report-head{border-bottom:3px solid #0f172a;padding-bottom:10px;margin-bottom:14px}
      .report-head h1{font-size:21pt;margin:0}.report-meta{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
      .report-score{margin:12px 0;padding:9px 11px;border:1px solid #888;background:#f3f4f6;font-weight:bold}
      .report-zone{break-inside:avoid;border:1px solid #aaa;border-radius:7px;margin:0 0 10px;padding:10px}
      .report-zone h2{display:flex;justify-content:space-between;margin:0 0 7px;font-size:14pt}
      .badge{padding:2px 8px;border-radius:20px;font-size:9pt;color:#fff}.badge.OK{background:#15803d}.badge.NOK{background:#b91c1c}.badge.NA{background:#64748b}
      .report-zone p{margin:5px 0}.report-photo{display:block;max-width:100%;max-height:105mm;object-fit:contain;margin:8px auto 0;border:1px solid #bbb}
      .report-foot{margin-top:18px;padding-top:8px;border-top:1px solid #999;font-size:9pt;color:#555}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><div class="brandmark"><img src="icon.png" alt="Ikona Cleanily"></div><div><h1>Cleanily</h1><p class="subtitle">Audyt czystości • Laboratorium OQC WM</p></div></div>
    </header>

    <section class="meta" aria-label="Dane audytu">
      <div class="start"><span>Rozpoczęcie kontroli</span><strong id="startedAt"></strong></div>
    </section>

    <section class="progress-card" aria-label="Postęp audytu">
      <div class="progress-head"><span>Postęp kontroli</span><span id="progressText">0 / 6</span></div>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><div class="bar" id="progressBar"></div></div>
    </section>

    <section class="cards" id="zones"></section>

    <section class="summary">
      <h2>Podsumowanie audytu</h2>
      <p>Wykonaj wszystkie 6 zdjęć aparatem. Po zakończeniu zapisz cały audyt jako jeden obraz JPG w galerii lub udostępnij go do innej aplikacji.</p>
      <div class="actions">
        <button class="primary" id="imageBtn" type="button">▣ Zapisz raport w galerii</button>
        <button class="export" id="shareBtn" type="button">↗ Udostępnij raport</button>
        <button class="export" id="reportBtn" type="button">▣ Generuj raport / PDF</button>
        <button class="danger" id="resetBtn" type="button">↻ Resetuj / Nowy audyt</button>
      </div>
      <div class="save-indicator" id="saveIndicator" aria-live="polite">Dane są zapisywane automatycznie offline</div>
    </section>
  </main>

  <section id="printReport" aria-hidden="true"></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="native-plugins.js"></script>
  <script>
  (() => {
    'use strict';
    const STORAGE_KEY = 'oqc-wm-audit-photos-v2';
    const zones = [
      {name:'Biurko', criteria:'Czystość powierzchni, brak zbędnych przedmiotów oraz porządek w dokumentacji i sprzęcie.'},
      {name:'Kuchnia', criteria:'Czystość blatów, zlewu i sprzętów AGD oraz brak zalegających naczyń.'},
      {name:'Stół konferencyjny', criteria:'Czystość powierzchni, prawidłowe ułożenie krzeseł i brak pozostawionych próbek lub notatek.'},
      {name:'Podnośnik', criteria:'Czystość strefy roboczej, brak wycieków i zabrudzeń oraz prawidłowe odłożenie narzędzi.'},
      {name:'Komora hałasu', criteria:'Czystość podłogi i ścian wygłuszających oraz brak obcych przedmiotów wpływających na pomiary.'}
    ];
    const blank = () => ({startedAt:new Date().toISOString(), areas:zones.map(() => ({photo:'', photoName:''})), panorama:'', panoramaName:''});
    let data = load();
    let saveTimer;
    let toastTimer;

    const $ = (s, root=document) => root.querySelector(s);
    const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const formatDate = iso => new Intl.DateTimeFormat('pl-PL',{dateStyle:'medium',timeStyle:'short'}).format(new Date(iso));

    function load(){
      try{
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if(saved && Array.isArray(saved.areas) && saved.areas.length === 5) return {...blank(),...saved};
      }catch(e){}
      return blank();
    }

    function save(){
      clearTimeout(saveTimer);
      $('#saveIndicator').textContent = 'Zapisywanie…';
      saveTimer = setTimeout(() => {
        try{
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          $('#saveIndicator').textContent = '✓ Zapisano lokalnie: ' + new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
        }catch(e){
          $('#saveIndicator').textContent = 'Nie udało się zapisać — usuń część zdjęć';
          notify('Brak miejsca w pamięci. Usuń lub zmień część zdjęć.', true);
        }
      }, 250);
    }

    function zoneHTML(z, i){
      return `<article class="card" data-index="${i}">
        <button class="card-head" type="button" aria-expanded="${i===0}" aria-controls="panel-${i}">
          <span class="num">${i+1}</span><span><span class="title">${esc(z.name)}</span><span class="state">Nie sprawdzono</span></span><span class="chev">⌄</span>
        </button>
        <div class="panel" id="panel-${i}"><div class="panel-inner"><div class="content">
          <p class="criteria">${esc(z.criteria)}</p>
          <div class="photo-block">
            <input class="photo-input" id="photo-${i}" type="file" accept="image/*" capture="environment">
            <label class="photo-btn" for="photo-${i}">▣ Zrób zdjęcie aparatem</label>
            <div class="preview-wrap"></div>
          </div>
        </div></div></div>
      </article>`;
    }

    function render(){
      $('#zones').innerHTML = zones.map(zoneHTML).join('') + `<article class="card panorama" data-index="5">
        <button class="card-head" type="button" aria-expanded="false" aria-controls="panel-5">
          <span class="num">6</span><span><span class="title">Zdjęcie całego laboratorium</span><span class="state">Wymagane zdjęcie</span></span><span class="chev">⌄</span>
        </button>
        <div class="panel" id="panel-5"><div class="panel-inner"><div class="content">
          <div class="hint"><b>!</b><span>Wykonaj przynajmniej jedno zdjęcie całej przestrzeni z wyznaczonego punktu. Bez niego audyt nie może zostać zakończony.</span></div>
          <input class="photo-input" id="panorama" type="file" accept="image/*" capture="environment">
          <label class="photo-btn" for="panorama">▧ Zrób zdjęcie całego laboratorium</label>
          <div class="preview-wrap"></div>
        </div></div></div>
      </article>`;
      $('.card').classList.add('open');
      restoreUI();
      bind();
      updateProgress();
    }

    function restoreUI(){
      $('#startedAt').textContent = formatDate(data.startedAt);
      data.areas.forEach((area, i) => {
        const card = $(`.card[data-index="${i}"]`);
        showPreview(i, area.photo, area.photoName);
      });
      showPreview(5, data.panorama, data.panoramaName);
    }

    function bind(){
      document.querySelectorAll('.card-head').forEach(btn => btn.addEventListener('click', () => {
        const card=btn.closest('.card'); card.classList.toggle('open'); btn.setAttribute('aria-expanded',card.classList.contains('open'));
      }));
      document.querySelectorAll('.card[data-index]:not([data-index="5"])').forEach(card => {
        const i=Number(card.dataset.index);
        $(`#photo-${i}`).addEventListener('change', e => handleImage(e.target.files[0],i));
      });
      $('#panorama').addEventListener('change', e => handleImage(e.target.files[0],5));
      $('#imageBtn').addEventListener('click', saveCombinedImage);
      $('#shareBtn').addEventListener('click', shareCombinedImage);
      $('#reportBtn').addEventListener('click', generateReport);
      $('#resetBtn').addEventListener('click', resetAudit);
    }

    function showPreview(i, src, name){
      const card=$(`.card[data-index="${i}"]`), wrap=$('.preview-wrap',card);
      if(!src){wrap.innerHTML=''; return;}
      wrap.innerHTML=`<div class="preview"><img src="${src}" alt="Podgląd zdjęcia: ${i===5?'całe laboratorium':esc(zones[i].name)}"><button class="remove" type="button" aria-label="Usuń zdjęcie">×</button><div class="photo-meta">${esc(name || 'Zdjęcie skompresowane')}</div></div>`;
      $('.remove',wrap).addEventListener('click', () => {
        if(i===5){data.panorama='';data.panoramaName='';$('#panorama').value='';}else{data.areas[i].photo='';data.areas[i].photoName='';$(`#photo-${i}`).value='';}
        showPreview(i,'',''); updateProgress(); save();
      });
    }

    async function handleImage(file,i){
      if(!file) return;
      if(!file.type.startsWith('image/')){notify('Wybierz plik graficzny.',true);return;}
      try{
        notify('Kompresowanie zdjęcia…');
        const src=await compressImage(file,i===5?1600:1200,i===5?.76:.72);
        if(i===5){data.panorama=src;data.panoramaName=file.name;}else{data.areas[i].photo=src;data.areas[i].photoName=file.name;}
        showPreview(i,src,file.name); updateProgress(); save(); notify('Zdjęcie dodane i skompresowane.');
      }catch(e){notify('Nie udało się przetworzyć zdjęcia.',true);}
    }

    function compressImage(file,maxSide,quality){
      return new Promise((resolve,reject) => {
        const reader=new FileReader();
        reader.onerror=reject;
        reader.onload=() => {
          const img=new Image();
          img.onerror=reject;
          img.onload=() => {
            const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
            const canvas=document.createElement('canvas');
            canvas.width=Math.max(1,Math.round(img.naturalWidth*scale)); canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
            const ctx=canvas.getContext('2d',{alpha:false}); ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
            resolve(canvas.toDataURL('image/jpeg',quality));
          };
          img.src=reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function updateProgress(){
      let count=data.areas.filter(a=>a.photo).length+(data.panorama?1:0);
      $('#progressText').textContent=`${count} / 6`;
      $('#progressBar').style.width=`${count/6*100}%`;
      $('.track').setAttribute('aria-valuenow',count);
      data.areas.forEach((a,i)=>updateCardState(i,!!a.photo,a.photo?'Zdjęcie wykonane':'Wymagane zdjęcie'));
      updateCardState(5,!!data.panorama,data.panorama?'Zdjęcie dodane':'Wymagane zdjęcie');
    }

    function updateCardState(i,done,label){
      const card=$(`.card[data-index="${i}"]`); card.classList.toggle('done',done); $('.state',card).textContent=label;
    }

    function validate(){
      document.querySelectorAll('.card.error').forEach(c=>c.classList.remove('error'));
      let first=null, messages=[];
      data.areas.forEach((a,i)=>{
        if(!a.photo){messages.push(`zrób zdjęcie: ${zones[i].name}`);first??=$(`.card[data-index="${i}"]`);}
      });
      if(!data.panorama){messages.push('zrób zdjęcie całego laboratorium');first??=$('.card[data-index="5"]');}
      if(messages.length){
        if(first){first.classList.add('open','error');$('.card-head',first).setAttribute('aria-expanded','true');first.scrollIntoView({behavior:'smooth',block:'center'});}
        notify('Uzupełnij audyt: '+messages[0]+(messages.length>1?` (+${messages.length-1})`:''),true); return false;
      }
      return true;
    }

    function reportMarkup(){
      const rows=data.areas.map((a,i)=>`<article class="report-zone"><h2><span>${i+1}. ${esc(zones[i].name)}</span></h2><p><b>Zakres:</b> ${esc(zones[i].criteria)}</p><img class="report-photo" src="${a.photo}" alt="Zdjęcie strefy"></article>`).join('');
      return `<div class="report-head"><h1>Raport zdjęciowy audytu 5S</h1><b>Laboratorium OQC WM</b><div class="report-meta"><span><b>Rozpoczęcie:</b> ${esc(formatDate(data.startedAt))}</span><span><b>Wygenerowano:</b> ${esc(new Date().toLocaleString('pl-PL'))}</span><span><b>Zdjęcia:</b> 6 / 6</span></div></div>${rows}<article class="report-zone"><h2><span>6. Zdjęcie całego laboratorium</span></h2><img class="report-photo" src="${data.panorama}" alt="Zdjęcie całego laboratorium"></article><div class="report-foot">Raport wygenerowany lokalnie w aplikacji Audyt 5S • Laboratorium OQC WM.</div>`;
    }

    function generateReport(){
      if(!validate()) return;
      $('#printReport').innerHTML=reportMarkup();
      const imgs=[...$('#printReport').querySelectorAll('img')];
      Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r;}))).then(()=>setTimeout(()=>window.print(),80));
    }

    function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;});}

    function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight){
      const words=String(text).split(/\s+/),lines=[];let line='';
      words.forEach(word=>{const test=line?`${line} ${word}`:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word;}else line=test;});
      if(line)lines.push(line);lines.forEach((item,index)=>ctx.fillText(item,x,y+index*lineHeight));return lines.length*lineHeight;
    }

    function drawContainedImage(ctx,img,x,y,width,height){
      const scale=Math.min(width/img.width,height/img.height),drawWidth=img.width*scale,drawHeight=img.height*scale;
      ctx.fillStyle='#e5e7eb';ctx.fillRect(x,y,width,height);ctx.drawImage(img,x+(width-drawWidth)/2,y+(height-drawHeight)/2,drawWidth,drawHeight);
    }

    async function createCombinedImage(){
      if(!validate())return;
      notify('Tworzenie jednego obrazu z całego audytu…');
      const images=await Promise.all([...data.areas.map(a=>loadImage(a.photo)),loadImage(data.panorama)]);
        const width=1600,side=56,gap=32,photoWidth=(width-side*2-gap)/2,photoHeight=500,zoneHeight=620,headerHeight=285,footerHeight=110,height=headerHeight+zoneHeight*3+footerHeight;
        const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
        const ctx=canvas.getContext('2d',{alpha:false});
        ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,width,height);ctx.fillStyle='#0f172a';ctx.fillRect(0,0,width,headerHeight);
        ctx.fillStyle='#38bdf8';ctx.font='900 42px Arial, sans-serif';ctx.fillText('AUDYT CZYSTOŚCI 5S',side,82);
        ctx.fillStyle='#ffffff';ctx.font='700 62px Arial, sans-serif';ctx.fillText('Laboratorium OQC WM',side,158);
        ctx.fillStyle='#cbd5e1';ctx.font='32px Arial, sans-serif';ctx.fillText(`Rozpoczęcie: ${formatDate(data.startedAt)}`,side,218);ctx.fillText(`Zakończenie: ${new Date().toLocaleString('pl-PL')}`,side,258);
        for(let i=0;i<6;i++){
          const column=i%2,row=Math.floor(i/2),x=side+column*(photoWidth+gap),y=headerHeight+row*zoneHeight,title=i<5?zones[i].name:'Zdjęcie całego laboratorium';
          ctx.fillStyle=row%2?'#f1f5f9':'#ffffff';ctx.fillRect(x-12,y+10,photoWidth+24,zoneHeight-20);
          ctx.fillStyle='#0f172a';ctx.font='700 34px Arial, sans-serif';ctx.fillText(`${i+1}. ${title}`,x,y+60);
          drawContainedImage(ctx,images[i],x,y+88,photoWidth,photoHeight);ctx.strokeStyle='#cbd5e1';ctx.lineWidth=2;ctx.strokeRect(x,y+88,photoWidth,photoHeight);
        }
        ctx.fillStyle='#0f172a';ctx.fillRect(0,height-footerHeight,width,footerHeight);ctx.fillStyle='#cbd5e1';ctx.font='26px Arial, sans-serif';ctx.textAlign='center';ctx.fillText('Raport wygenerowany lokalnie • Audyt 5S OQC WM',width/2,height-44);
      const now=new Date(),fileName=`Cleanily-${now.toISOString().replace(/[:.]/g,'-')}`;
      return {canvas,fileName};
    }

    function downloadCanvas(canvas,fileName,message){
      canvas.toBlob(blob=>{
        if(!blob){notify('Nie udało się utworzyć obrazu.',true);return;}
        const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`${fileName}.jpg`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify(message);
      },'image/jpeg',.86);
    }

    async function saveCombinedImage(){
      try{
        const result=await createCombinedImage();
        if(!result)return;
        const {canvas,fileName}=result;
        if(window.CleanilyNative?.isNative?.()){
          try{
            await window.CleanilyNative.saveImageToGallery(canvas.toDataURL('image/jpeg',.86),fileName);
            notify('Zapisano raport w galerii, w albumie Cleanily.');
            return;
          }catch(nativeError){
            console.error('Zapis do galerii nie powiódł się:',nativeError);
          }
        }
        downloadCanvas(canvas,fileName,'Pobrano raport JPG.');
      }catch(error){console.error(error);notify('Nie udało się połączyć zdjęć.',true);}
    }

    async function shareCombinedImage(){
      try{
        const result=await createCombinedImage();
        if(!result)return;
        const {canvas,fileName}=result,dataUrl=canvas.toDataURL('image/jpeg',.86),fullName=`${fileName}.jpg`;
        if(window.CleanilyNative?.isNative?.() && window.CleanilyNative?.shareImage){
          await window.CleanilyNative.shareImage(dataUrl,fullName);
          notify('Otwarto menu udostępniania.');
          return;
        }
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.86));
        if(!blob)throw new Error('Nie udało się utworzyć pliku JPG.');
        const file=new File([blob],fullName,{type:'image/jpeg'});
        if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
          await navigator.share({title:'Raport Cleanily',text:'Raport zdjęciowy audytu czystości — Laboratorium OQC WM',files:[file]});
          return;
        }
        downloadCanvas(canvas,fileName,'Ta przeglądarka nie obsługuje udostępniania — pobrano raport JPG.');
      }catch(error){
        if(error?.name==='AbortError')return;
        console.error(error);notify('Nie udało się udostępnić raportu.',true);
      }
    }

    function resetAudit(){
      if(!confirm('Czy na pewno rozpocząć nowy audyt? Wszystkie zdjęcia zostaną usunięte z tego urządzenia.')) return;
      clearTimeout(saveTimer);localStorage.removeItem(STORAGE_KEY);data=blank();render();window.scrollTo({top:0,behavior:'smooth'});save();notify('Rozpoczęto nowy audyt.');
    }

    function notify(message,bad=false){
      const el=$('#toast');el.textContent=message;el.classList.toggle('bad',bad);el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200);
    }

    render();
  })();
  </script>
</body>
</html>
